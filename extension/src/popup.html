<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lint.one</title>
<meta name="color-scheme" content="light dark">
<link rel="preload" href="/shared/fonts/plex-sans-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/app.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="popup.css">
<script src="ui-theme.js"></script>
</head>
<body class="popup">

<header class="bar">
  <a class="logo" href="#" id="home" title="Open lint.one">
    <span class="logo-mark" aria-hidden="true"></span>
    <span class="logo-name">lint<span class="logo-tld">.one</span></span>
  </a>
  <span class="spacer"></span>
  <button type="button" class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.7 1.5h2.6l.4 1.9a5 5 0 0 1 1.2.7l1.8-.6 1.3 2.2-1.4 1.3a5 5 0 0 1 0 1.4l1.4 1.3-1.3 2.2-1.8-.6a5 5 0 0 1-1.2.7l-.4 1.9H6.7l-.4-1.9a5 5 0 0 1-1.2-.7l-1.8.6L2 9.7l1.4-1.3a5 5 0 0 1 0-1.4L2 5.7l1.3-2.2 1.8.6a5 5 0 0 1 1.2-.7z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
  </button>
</header>

<main>
  <!-- what is at hand: this page when it is a file, the tab's sound, what
       was just copied. Each one is one click (or Enter) from its tool. -->
  <div class="cards" id="cards">
    <button type="button" class="card" id="page" hidden>
      <span class="tool-tile tile-lg" id="pageTile" aria-hidden="true"></span>
      <span class="card-text">
        <span class="card-kicker">This page</span>
        <span class="card-name" id="pageName"></span>
        <span class="card-meta" id="pageMeta"></span>
      </span>
      <span class="card-go">Open</span>
    </button>

    <button type="button" class="card" id="clip" hidden>
      <span class="tool-tile tile-lg" id="clipTile" aria-hidden="true"></span>
      <span class="card-text">
        <span class="card-kicker">Just copied</span>
        <span class="card-name card-code" id="clipName"></span>
        <span class="card-meta" id="clipMeta"></span>
      </span>
      <span class="card-go">Open</span>
    </button>

    <button type="button" class="card" id="listen" hidden>
      <span class="tool-tile tile-lg dot-audio" aria-hidden="true"></span>
      <span class="card-text">
        <span class="card-kicker">Playing</span>
        <span class="card-name">Listen to this tab</span>
        <span class="card-meta" id="listenMeta">Live spectrum</span>
      </span>
      <span class="card-go">Listen</span>
    </button>
  </div>

  <section class="paste">
    <textarea id="paste" spellcheck="false" autocomplete="off" rows="3"
      aria-label="Paste something to open"
      placeholder="Paste JSON, YAML, CSV, XML, .env, a log…"></textarea>
    <div class="paste-bar">
      <div class="menu-wrap">
        <button type="button" class="as-btn bordered" id="asBtn" aria-haspopup="true" aria-expanded="false" disabled>
          <span class="tool-tile" id="asTile" aria-hidden="true"></span>
          <span id="asName">Detects the format</span>
          <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="menu as-menu" id="asMenu" role="menu"></div>
      </div>
      <span class="spacer"></span>
      <span class="keys" id="openKeys"></span>
      <button type="button" class="primary" id="openPaste" disabled>Open</button>
    </div>
  </section>

  <!-- shown once, until turned on or dismissed: the clipboard card above
       is the quickest way in, and it is off until asked for -->
  <section class="tip" id="tip" hidden>
    <span class="tip-text"><b>Copy, then click.</b> Let lint.one offer what you just copied, so opening it is one click.</span>
    <span class="tip-actions">
      <button type="button" class="bordered" id="tipOn">Turn on</button>
      <button type="button" class="icon-btn" id="tipOff" title="Not now" aria-label="Not now">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </span>
  </section>

  <section class="recent" id="recent" hidden>
    <div class="section-head">
      <span class="label">Recent</span>
      <span class="spacer"></span>
      <button type="button" class="link-btn" id="clearRecent" title="Forget these now (they go anyway when Chrome closes)">Clear</button>
    </div>
    <div class="rows" id="recentRows"></div>
  </section>

  <section class="tools">
    <div class="section-head"><span class="label">Tools</span></div>
    <div class="grid" id="tools"></div>
  </section>
</main>

<footer class="foot">
  <span class="private" title="Everything opens in lint.one, in this browser. Nothing is uploaded.">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    Stays in this browser
  </span>
  <span class="spacer"></span>
  <a href="#" class="shortcut" id="shortcut" title="Open the selection, or this page — change it in Chrome's shortcuts"></a>
</footer>

<script src="base.js"></script>
<script src="formats.js"></script>
<script src="settings.js"></script>
<script src="popup.js"></script>
</body>
</html>
