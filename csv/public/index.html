<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="A fast, private CSV viewer, validator and CSV ↔ JSON converter. Everything runs in your browser — your data never leaves the page.">
<link rel="canonical" href="https://lint.one/csv/">
<!-- one installable app for the whole suite; its file_handlers send each
     format to its own page, where LintApp.takeHandoff takes the file -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="lint">
<meta name="theme-color" content="#FBFBFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171C" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="lint.one">
<meta property="og:url" content="https://lint.one/csv/">
<meta property="og:title" content="CSV Viewer &amp; Formatter · lint.one">
<meta property="og:description" content="A fast, private CSV viewer, validator and CSV ↔ JSON converter. Everything runs in your browser — your data never leaves the page.">

     repaint them on top and lose the format colours and glyphs -->

<link rel="stylesheet" href="/shared/app.css">
<style>
/* CSV shows a table instead of a tree — the only per-tool styling
   in the suite, and it reuses the shared tokens throughout. */
#tree.table-mode { padding: 0; font-family: var(--ui); }

.csv-table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
/* cells are the document, so they follow the text zoom (--code-size);
   the header, type hints and row numbers scale with them */
.csv-table th, .csv-table td {
  font-family: var(--mono); font-size: var(--code-size, var(--fs-base));
  padding: var(--s1) var(--s3);
  border-bottom: var(--hairline) solid var(--line);
  border-right: var(--hairline) solid var(--line);
  text-align: left; white-space: nowrap;
  max-width: 340px; overflow: hidden; text-overflow: ellipsis;
}
.csv-table thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--raised);
  color: var(--t-key); font-weight: 600;
  border-bottom: var(--hairline) solid var(--line-strong);
  font-family: var(--ui);
  cursor: pointer; user-select: none;
}
.csv-table thead th:hover { background: var(--row-hover); }
.csv-table thead th .sort { color: var(--hue); margin-left: var(--s1); font-size: calc(var(--code-size, var(--fs-base)) * 0.75); }
.csv-table thead th .coltype {
  display: block; font-family: var(--mono); font-size: calc(var(--code-size, var(--fs-base)) * 0.78);
  font-weight: 400; color: var(--faint); letter-spacing: 0;
}

/* row-number column, tinted like the editor gutter */
.csv-table .rn {
  position: sticky; left: 0; z-index: 1;
  background: color-mix(in srgb, var(--hue) var(--gutter-tint), var(--raised));
  color: color-mix(in srgb, var(--hue) var(--gutter-ink), var(--muted));
  text-align: right; font-variant-numeric: tabular-nums;
  border-right: var(--hairline) solid var(--line);
  font-size: calc(var(--code-size, var(--fs-base)) * 0.85); padding: var(--s1) var(--s2);
}
.csv-table thead .rn { z-index: 3; }
.csv-table tbody tr:hover td { background: var(--row-hover); }
.csv-table tbody tr:hover .rn { background: color-mix(in srgb, var(--hue) 26%, var(--raised)); }
.csv-table td.num { color: var(--t-num); text-align: right; font-variant-numeric: tabular-nums; }
.csv-table td.empty-cell { color: var(--faint); font-style: italic; }
.csv-table td.ragged { background: color-mix(in srgb, var(--bad) 13%, transparent); }

/* "Header row" — a setting of the table, kept quiet in its bar */
.header-toggle {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 0 var(--s2); font-size: var(--fs-small); color: var(--muted);
  white-space: nowrap; cursor: pointer; user-select: none;
}
.header-toggle:hover { color: var(--ink); }
.header-toggle input { margin: 0; accent-color: var(--ink); }

/* ---------- a file too large to edit (body.big-file) ----------
   No editor: the table takes the page, a page of rows at a time from
   DuckDB, with a pager in its bar */
body.big-file #editorPane, body.big-file #divider, body.big-file #editorRail,
body.big-file .tabs, body.big-file .empty-prompt, body.big-file #btnFormat,
body.big-file #btnSearchMode, body.big-file #stepNav { display: none !important; }
body.big-file #treePane { display: flex !important; }
body.big-file #statusBar { display: flex !important; }
body.big-file .tool-actions { visibility: visible !important; }
.big-pager { display: inline-flex; align-items: center; gap: 2px; flex: none; margin-left: var(--s1); }
.big-pager[hidden] { display: none; }
.big-pager span {
  font-size: var(--fs-small); color: var(--muted); white-space: nowrap;
  font-variant-numeric: tabular-nums; padding: 0 var(--s1);
}
.big-pager .icon-btn svg { width: 15px; height: 15px; }
#tree.stale .csv-table { opacity: .55; transition: opacity .2s .15s; }
.big-note {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s2);
  height: 100%; padding: var(--s5); text-align: center; color: var(--muted); font-family: var(--ui);
}
.big-note h3 { margin: 0; color: var(--ink); font-size: var(--fs-large); font-weight: 600; }
.big-note p { margin: 0; max-width: 460px; font-size: var(--fs-base); line-height: 1.55; }
.big-note.err h3 { color: var(--bad); }
.big-note .bar { width: 220px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: var(--s2); }
.big-note .bar span { display: block; height: 100%; width: 30%; background: var(--hue); border-radius: 2px;
  animation: big-slide 1.2s ease-in-out infinite; }
@keyframes big-slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
@media (prefers-reduced-motion: reduce) { .big-note .bar span { animation: none; width: 100%; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
window.LINT_CONFIG = {
  id: 'csv',
  name: 'CSV',
  host: 'lint.one/csv',
  label: 'CSV',
  emptyLine: 'You\'ll get a sortable table, with the delimiter detected for you.',
  hue: '#4D7C0F',
  hueInk: '#FFFFFF',
  accept: '.csv,.tsv,.txt,text/csv',
  placeholder: 'Paste CSV or drop a file…',
  searchPlaceholder: 'Filter rows…',
  actions: [
    { id: 'btnFormat', label: 'Fix quotes', key: 'shift+alt+f', title: 'Quote only the cells that need quotes, and unquote the rest' }
  ],
  convert: [
    { id: 'btnToJson', label: 'JSON', key: 'mod+shift+j', title: 'Convert the rows to a JSON array and open it in the JSON viewer (also copied)' }
  ],
  /* only for a file too large to edit, which has no editor text to copy */
  export: [
    { id: 'btnBigCsv', label: 'Download these rows', title: 'Save the rows as the table shows them, filtered and sorted, as a CSV file (up to 100,000 rows)' }
  ],
  ext: 'csv'
};
</script>
<script src="/shared/theme-boot.js"></script>
<script src="/shared/shell.js"></script>
<script src="/shared/app.js"></script>
<script>
(function () {
'use strict';

var esc = LintApp.esc;
var hasHeader = true;
try { hasHeader = localStorage.getItem('lintuz-csv-header') !== '0'; } catch (e) {}

/* ==========================================================================
   Syntax highlighting — delimiters and quoted fields, so the shape of a
   row is readable before it reaches the table.
   ========================================================================== */
var hlDelim = ',';

function highlight(text) {
  var lines = text.split('\n');
  var out = [];
  var d = hlDelim;

  for (var li = 0; li < lines.length; li++) {
    var line = lines[li];

    /* the header line is one colour end to end */
    if (li === 0 && hasHeader) {
      out.push('<span class="hl-key">' + esc(line) + '</span>');
      continue;
    }

    var buf = '', cur = '', inQ = false;

    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (inQ) {
        cur += c;
        if (c === '"') {
          if (line[i + 1] === '"') { cur += '"'; i++; }
          else {
            inQ = false;
            buf += '<span class="hl-str">' + esc(cur) + '</span>';
            cur = '';
          }
        }
      } else if (c === '"' && cur === '') {
        inQ = true; cur = c;
      } else if (c === d) {
        buf += field(cur) + '<span class="hl-punct">' + esc(c) + '</span>';
        cur = '';
      } else {
        cur += c;
      }
    }
    buf += inQ ? '<span class="hl-str">' + esc(cur) + '</span>' : field(cur);
    out.push(buf);
  }
  return out.join('\n');
}

function field(v) {
  if (v === '') return '';
  var t = v.trim();
  if (isNumeric(t)) return '<span class="hl-num">' + esc(v) + '</span>';
  if (/^(true|false)$/i.test(t)) return '<span class="hl-bool">' + esc(v) + '</span>';
  return esc(v);
}

/* ==========================================================================
   Parsing — RFC 4180, with delimiter sniffing
   ========================================================================== */
function sniffDelimiter(text) {
  var sample = text.slice(0, 8000).split('\n').slice(0, 12).join('\n');
  var best = ',', bestScore = -1;
  [',', '\t', ';', '|'].forEach(function (d) {
    var counts = sample.split('\n')
      .filter(function (l) { return l.trim(); })
      .map(function (l) { return splitLine(l, d).length; });
    if (!counts.length) return;
    var first = counts[0];
    if (first < 2) return;
    /* prefer the delimiter that yields a consistent column count */
    var consistent = counts.filter(function (c) { return c === first; }).length;
    var score = consistent * 100 + first;
    if (score > bestScore) { bestScore = score; best = d; }
  });
  return best;
}

/* only used for sniffing; the real parse is the state machine below */
function splitLine(line, delim) {
  var out = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (inQ) {
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') inQ = false;
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === delim) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

function parse(text) {
  var delim = sniffDelimiter(text);
  var rows = [], row = [], cur = '';
  var inQ = false, i = 0, line = 1, col = 1;
  var quoteStart = null;

  while (i < text.length) {
    var c = text[i];

    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { cur += '"'; i += 2; col += 2; continue; }
        inQ = false; i++; col++; continue;
      }
      if (c === '\n') { line++; col = 1; } else col++;
      cur += c; i++; continue;
    }

    if (c === '"') {
      if (cur.trim() !== '') {
        return {
          ok: false,
          message: 'A quote opened in the middle of an unquoted field',
          pos: i, line: line, col: col
        };
      }
      inQ = true; quoteStart = { line: line, col: col };
      i++; col++; continue;
    }

    if (c === delim) { row.push(cur); cur = ''; i++; col++; continue; }

    if (c === '\r') { i++; continue; }

    if (c === '\n') {
      row.push(cur); cur = '';
      rows.push(row); row = [];
      i++; line++; col = 1; continue;
    }

    cur += c; i++; col++;
  }

  if (inQ) {
    return {
      ok: false,
      message: 'A quoted field was never closed',
      pos: text.length,
      line: quoteStart ? quoteStart.line : line,
      col: quoteStart ? quoteStart.col : col
    };
  }

  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  rows = rows.filter(function (r) {
    return r.length > 1 || (r[0] !== undefined && r[0] !== '');
  });

  if (!rows.length) return { ok: false, message: 'No rows found', pos: null };

  return { ok: true, value: { rows: rows, delim: delim } };
}

function isNumeric(s) {
  return s !== '' && /^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(s.trim());
}

function columnType(rows, idx, from) {
  var seen = 0, nums = 0;
  for (var r = from; r < rows.length && seen < 80; r++) {
    var v = (rows[r][idx] || '').trim();
    if (!v) continue;
    seen++;
    if (isNumeric(v)) nums++;
  }
  if (!seen) return 'empty';
  return nums === seen ? 'number' : 'text';
}

function stats(model) {
  var rows = model.rows;
  var body = hasHeader ? rows.length - 1 : rows.length;
  var cols = rows[0] ? rows[0].length : 0;
  var ragged = 0;
  for (var i = 0; i < rows.length; i++) if (rows[i].length !== cols) ragged++;
  var name = { ',': 'comma', '\t': 'tab', ';': 'semicolon', '|': 'pipe' }[model.delim];
  return LintApp.fmtNum(Math.max(0, body)) + ' rows, ' + cols + ' columns, ' +
    name + '-separated' + (ragged ? ', ' + ragged + ' ragged' : '');
}

/* ==========================================================================
   Table rendering — replaces the shared tree for this tool
   ========================================================================== */
var sortCol = null, sortDir = 1;
var currentModel = null;

function renderTable() {
  var treeEl = document.getElementById('tree');
  var matchCount = document.getElementById('matchCount');
  treeEl.classList.add('table-mode');
  if (big) { bigFilter(); return; }

  if (!currentModel) {
    treeEl.innerHTML = EMPTY;
    matchCount.textContent = '';
    return;
  }

  var rows = currentModel.rows;
  var headerRow = hasHeader ? rows[0] : null;
  var from = hasHeader ? 1 : 0;
  var colCount = 0;
  for (var r = 0; r < rows.length; r++) colCount = Math.max(colCount, rows[r].length);

  var q = document.getElementById('search').value.trim().toLowerCase();
  var body = rows.slice(from).map(function (row, i) { return { row: row, n: i + 1 }; });

  if (q) {
    body = body.filter(function (item) {
      for (var c = 0; c < item.row.length; c++) {
        if (String(item.row[c]).toLowerCase().indexOf(q) !== -1) return true;
      }
      return false;
    });
    matchCount.textContent = body.length
      ? LintApp.fmtNum(body.length) + (body.length === 1 ? ' row' : ' rows')
      : 'no matches';
  } else {
    matchCount.textContent = '';
  }

  if (sortCol !== null) {
    var numeric = columnType(rows, sortCol, from) === 'number';
    body.sort(function (a, b) {
      var x = (a.row[sortCol] || '').trim(), y = (b.row[sortCol] || '').trim();
      if (numeric) return (parseFloat(x) - parseFloat(y)) * sortDir;
      return x.localeCompare(y) * sortDir;
    });
  }

  var types = [];
  for (var t = 0; t < colCount; t++) types.push(columnType(rows, t, from));

  var html = '<table class="csv-table"><thead><tr><th class="rn"></th>';
  for (var h = 0; h < colCount; h++) {
    var label = headerRow && headerRow[h] !== undefined && headerRow[h] !== ''
      ? headerRow[h] : colName(h);
    var arrow = sortCol === h ? '<span class="sort">' + (sortDir === 1 ? '▲' : '▼') + '</span>' : '';
    html += '<th data-col="' + h + '" title="Sort by this column">' +
      esc(label) + arrow +
      '<span class="coltype">' + types[h] + '</span></th>';
  }
  html += '</tr></thead><tbody>';

  var LIMIT = 2000;
  var shown = body.slice(0, LIMIT);
  for (var i = 0; i < shown.length; i++) {
    var row = shown[i].row;
    html += '<tr><td class="rn">' + shown[i].n + '</td>';
    for (var c = 0; c < colCount; c++) {
      var v = row[c];
      var cls = [];
      if (v === undefined) cls.push('ragged');
      else if (v === '') cls.push('empty-cell');
      else if (types[c] === 'number' && isNumeric(v)) cls.push('num');
      var text = v === undefined ? '—' : (v === '' ? '∅' : v);
      html += '<td' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') +
        ' title="' + esc(String(v === undefined ? '' : v)) + '">' + esc(text) + '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table>';

  if (body.length > LIMIT) {
    html += '<div class="notice">Showing the first ' + LintApp.fmtNum(LIMIT) +
      ' of ' + LintApp.fmtNum(body.length) + ' rows.</div>';
  }
  if (!body.length) {
    html = '<div class="empty">No rows match “' + esc(q) + '”.</div>';
  }

  treeEl.innerHTML = html;
}

function colName(i) {
  var s = '';
  i++;
  while (i > 0) { var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = ((i - m) / 26) | 0; }
  return s;
}

/* ==========================================================================
   A file too large to edit

   Parsing a CSV into the editor and the table costs the tab ten to twelve
   times the file's size: 700 MB for a 60 MB file, and a crashed tab well
   before a gigabyte. Past BIG_BYTES the file goes to DuckDB instead, the
   Parquet tool's engine (parquet/sql.js), which reads it once into a
   compact table of its own in a worker. The page then asks it for 200 rows
   at a time; sorting and filtering are queries, a second or less on
   millions of rows, and the tab itself stays at a few megabytes. The file
   is not editable in this mode; it is read from disk and never uploaded.
   ========================================================================== */
var BIG_BYTES = 20 * 1048576;
var BIG_PAGE = 200;
var big = null;       // {file, worker, calls, info, offset, order, filter, total, seq}

function bigRpc(type, data) {
  var b = big;
  return new Promise(function (resolve, reject) {
    var id = ++b.nextId;
    b.calls[id] = { resolve: resolve, reject: reject };
    b.worker.postMessage(Object.assign({ id: id, type: type }, data));
  });
}

function bigStatus(kind, msg) {
  if (app) app.setStatus(kind, msg);
}

function bigNote(cls, title, text, busy) {
  var treeEl = document.getElementById('tree');
  treeEl.classList.remove('stale');
  treeEl.innerHTML = '<div class="big-note ' + cls + '"><h3>' + esc(title) + '</h3>' +
    (text ? '<p>' + esc(text) + '</p>' : '') + (busy ? '<div class="bar"><span></span></div>' : '') + '</div>';
}

function openBig(file) {
  closeBig(true);
  currentModel = null;
  sortCol = null; sortDir = 1;
  big = { file: file, worker: null, calls: {}, nextId: 0, info: null, offset: 0, order: null,
          filter: document.getElementById('search').value.trim(), total: null, seq: 0, page: null };
  document.body.classList.add('big-file');
  LintApp.setDocument(file.name, function () { closeBig(); });
  document.getElementById('bigPager').hidden = false;

  var b = big;
  b.worker = new Worker('/parquet/sql.js', { type: 'module' });
  b.worker.onmessage = function (e) {
    var m = e.data;
    if (m.type === 'progress') {
      if (big !== b || b.info) return;
      /* the engine's own download, the first time; then back to the file */
      if (m.done < m.total) {
        bigNote('', 'Getting the table engine ready',
          LintApp.fmtBytes(m.done) + ' of ' + LintApp.fmtBytes(m.total) + ', only the first time. Then ' +
          LintApp.fmtBytes(file.size) + ' of CSV is read on your device.', true);
      } else bigReadingNote();
      return;
    }
    var call = b.calls[m.id];
    if (!call) return;
    delete b.calls[m.id];
    if (m.ok) call.resolve(m); else call.reject(new Error(m.error));
  };
  b.worker.onerror = function (e) {
    e.preventDefault();
    Object.keys(b.calls).forEach(function (k) { b.calls[k].reject(new Error('The table engine could not start in this browser.')); });
    b.calls = {};
  };
  bigLoadFile();
}

/* (re)read the file into DuckDB's table, with the header setting as it is */
function bigLoadFile() {
  var b = big;
  b.info = null; b.total = null; b.offset = 0; b.order = null; sortCol = null;
  bigReadingNote();
  var t0 = performance.now();
  bigRpc('open', { file: b.file, format: 'csv', header: hasHeader }).then(function (info) {
    if (big !== b) return;
    b.info = info;
    b.total = info.rows;
    b.secs = (performance.now() - t0) / 1000;
    bigStatusLine();
    bigPage();
  }, function (err) {
    if (big !== b) return;
    bigStatus('err', err.message);
    bigNote('err', 'This file could not be read', err.message, false);
  });
}

function bigReadingNote() {
  bigStatus('', 'Reading ' + big.file.name + ' (' + LintApp.fmtBytes(big.file.size) + ')…');
  bigNote('', 'Reading ' + LintApp.fmtBytes(big.file.size) + ' of CSV',
    'Too large to edit here, so DuckDB reads it into a table on your device. ' +
    'This takes a few seconds once; sorting and filtering are quick after.', true);
}

function bigStatusLine() {
  var i = big.info;
  var name = { ',': 'comma', '\t': 'tab', ';': 'semicolon', '|': 'pipe' }[i.delim];
  bigStatus('ok', [
    LintApp.fmtNum(i.rows) + (i.rows === 1 ? ' row' : ' rows') + ', ' + i.columns.length + ' columns' +
      (name ? ', ' + name + '-separated' : ''),
    LintApp.fmtBytes(big.file.size) + ', too large to edit: read by ' + i.engine + ' in ' + big.secs.toFixed(1) + ' s' +
      (i.typed ? '' : ', every column as text') +
      (i.inMemory ? '' : ', read from the file each time (too large to hold)')
  ]);
}

function bigFilter() {
  if (!big) return;
  big.filter = document.getElementById('search').value.trim();
  big.offset = 0;
  big.total = big.filter ? null : big.info && big.info.rows;
  if (big.info) bigPage();
}

/* One page of rows. A newer request makes an older answer irrelevant; the
   count of a filter comes after its first page, as in the Parquet tool. */
function bigPage() {
  var b = big;
  if (!b || !b.info) return;
  var seq = ++b.seq;
  var want = { offset: b.offset, limit: BIG_PAGE, order: b.order, filter: b.filter };
  document.getElementById('tree').classList.add('stale');
  bigRpc('rows', want).then(function (d) {
    if (big !== b || seq !== b.seq) return;
    if (d.total !== null && d.total !== undefined) b.total = d.total;
    b.page = d;
    bigRender();
    if (want.filter && (d.total === null || d.total === undefined)) {
      return bigRpc('count', { filter: want.filter }).then(function (c) {
        if (big !== b || seq !== b.seq) return;
        b.total = c.n;
        bigPager();
      });
    }
  }).catch(function (err) {
    if (big !== b || seq !== b.seq) return;
    bigNote('err', 'That did not work', err.message, false);
  });
}

function bigCell(v) {
  if (v === null || v === undefined) return { text: '∅', cls: 'empty-cell', title: 'null' };
  if (typeof v === 'object') {
    if (typeof v.t === 'string') return { text: v.t + '…', cls: '', title: v.t + '… (' + LintApp.fmtNum(v.n) + ' characters)' };
    if (v.b !== undefined) return { text: v.b + ' bytes', cls: 'empty-cell', title: '' };
    return { text: JSON.stringify(v), cls: '', title: '' };
  }
  var s = String(v);
  return { text: s === '' ? '∅' : s, cls: s === '' ? 'empty-cell' : '', title: s };
}

function bigRender() {
  var d = big.page, treeEl = document.getElementById('tree');
  var cols = big.info.columns;
  var NUM = { int: 1, float: 1, decimal: 1 };
  var html = '<table class="csv-table"><thead><tr><th class="rn"></th>';
  cols.forEach(function (c, h) {
    var arrow = big.order && big.order.col === c.name
      ? '<span class="sort">' + (big.order.dir === 1 ? '▲' : '▼') + '</span>' : '';
    html += '<th data-col="' + h + '" title="Sort by this column">' + esc(c.name) + arrow +
      '<span class="coltype">' + esc(c.type) + '</span></th>';
  });
  html += '</tr></thead><tbody>';
  d.rows.forEach(function (row, i) {
    html += '<tr><td class="rn">' + LintApp.fmtNum(big.offset + i + 1) + '</td>';
    row.forEach(function (v, c) {
      var x = bigCell(v);
      var cls = x.cls || (NUM[cols[c].kind] ? 'num' : '');
      html += '<td' + (cls ? ' class="' + cls + '"' : '') + ' title="' + esc(x.title) + '">' + esc(x.text) + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  if (!d.rows.length) html = '<div class="empty">' + (big.filter ? 'No rows match “' + esc(big.filter) + '”.' : 'No rows.') + '</div>';
  treeEl.classList.remove('stale');
  treeEl.innerHTML = html;
  treeEl.scrollTop = 0;
  bigPager();
}

function bigPager() {
  var pos = document.getElementById('bigPos');
  var shown = big.page ? big.page.rows.length : 0;
  var total = big.total;
  pos.textContent = shown
    ? LintApp.fmtNum(big.offset + 1) + '–' + LintApp.fmtNum(big.offset + shown) + ' of ' +
      (total === null || total === undefined ? '…' : LintApp.fmtNum(total))
    : '';
  document.getElementById('matchCount').textContent = big.filter && total !== null && total !== undefined
    ? LintApp.fmtNum(total) + (total === 1 ? ' row' : ' rows') : '';
  document.getElementById('btnBigPrev').disabled = big.offset === 0;
  document.getElementById('btnBigNext').disabled = shown < BIG_PAGE ||
    (total !== null && total !== undefined && big.offset + shown >= total);
}

function bigTurn(dir) {
  if (!big || !big.page) return;
  var next = big.offset + dir * BIG_PAGE;
  if (next < 0 || (dir > 0 && big.page.rows.length < BIG_PAGE)) return;
  big.offset = next;
  bigPage();
}

/* the rows as the table shows them, filtered and sorted, as JSON */
function bigToJson() {
  var b = big;
  if (!b.info) return;
  LintApp.toast('Converting…');
  bigRpc('export', { view: 'grid', order: b.order, filter: b.filter, format: 'json' }).then(function (d) {
    LintApp.copyAndOffer(d.text, 'JSON', 'csv', 'json');
    if (d.clipped) LintApp.toast('The first ' + LintApp.fmtNum(d.rows) + ' rows, as JSON. For the rest, use a filter.');
  }, function (err) { LintApp.toast(err.message); });
}

/* the rows as the table shows them, filtered and sorted, as a file */
function bigDownload() {
  var b = big;
  if (!b || !b.info) return;
  LintApp.toast('Preparing…');
  bigRpc('export', { view: 'grid', order: b.order, filter: b.filter, format: 'csv' }).then(function (d) {
    var name = b.file.name.replace(/\.[^.]+$/, '') + (b.filter || b.order ? '-rows' : '-first') + '.csv';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([d.text], { type: 'text/csv' }));
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
    LintApp.toast((d.clipped ? 'The first ' : '') + LintApp.fmtNum(d.rows) + ' rows saved as ' + name);
  }, function (err) { LintApp.toast(err.message); });
}

/* quiet: another document is taking its place */
function closeBig(quiet) {
  if (!big) return;
  if (big.worker) big.worker.terminate();
  big = null;
  document.body.classList.remove('big-file');
  document.getElementById('bigPager').hidden = true;
  document.getElementById('matchCount').textContent = '';
  if (quiet) return;
  LintApp.setDocument(null);
  document.getElementById('search').value = '';
  bigStatus('', '');
  renderTable();
  app.editor.input.focus();
}

var EMPTY = LintApp.emptyState({
  title: 'Paste CSV to see it as a table',
  body: 'Click a column heading to sort; the row filter searches every cell.',
  extra: '<div class="empty-actions"><button class="bordered" data-empty="sample">Load a sample</button></div>'
});

/* ==========================================================================
   Boot
   ========================================================================== */
var SAMPLE = `endpoint,method,auth,p99_ms,rate_limit,burst,healthy
/v2/cart,GET,required,84,120,40,true
/v2/cart,POST,required,97,120,40,true
/v2/cart,DELETE,required,61,120,40,true
/v2/checkout,POST,required,212,30,5,true
/v2/orders,GET,required,143,60,20,true
/v2/orders/{id},GET,required,78,60,20,true
/v2/refunds,POST,required,ended,10,2,false
/health,GET,none,3,,,true
/metrics,GET,none,7,,,true
"/v2/search?q=shoes&sort=price",GET,optional,318,45,15,true`;

var app = LintApp.init({
  id: 'csv',
  label: 'CSV',
  parse: parse,
  stats: stats,
  highlighter: highlight,
  autoDepth: 1,
  ownsPane: true,
  emptyHTML: EMPTY,
  /* the shared tree is unused here — a minimal adapter keeps its
     wiring inert while the table owns the right-hand pane */
  adapter: {
    pathLabel: 'Cell',
    rootEntry: function () { return { key: undefined, value: null, path: [] }; },
    children: function () { return []; },
    childCount: function () { return 0; },
    matches: function () { return false; },
    path: function () { return ''; },
    decorate: function () {},
    actions: function () { return []; }
  },
  largeFile: { bytes: BIG_BYTES, open: openBig },
  onParsed: function (model) {
    /* a document in the editor (a smaller file, a paste, the sample) ends
       the large file's table; the empty editor it leaves behind does not */
    if (model && big) closeBig(true);
    /* the emptied editor's run has just cleared the status bar */
    if (big) { if (big.info) bigStatusLine(); else bigStatus('', 'Reading ' + big.file.name + ' (' + LintApp.fmtBytes(big.file.size) + ')…'); return; }
    currentModel = model;
    if (model && model.delim !== hlDelim) {
      /* repaint once with the real delimiter the sniffer found */
      hlDelim = model.delim;
      app.editor.paint();
    }
    renderTable();
  },
  sample: SAMPLE
});

/* this tool owns the right-hand pane, so it paints its own empty state */
renderTable();

/* the table owns search and expand/collapse for this tool */
var searchTimer;
document.getElementById('search').addEventListener('input', function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderTable, 200);
});

document.getElementById('tree').addEventListener('click', function (e) {
  var th = e.target.closest('th[data-col]');
  if (!th) return;
  var col = parseInt(th.dataset.col, 10);
  if (big) {
    if (!big.info) return;
    var name = big.info.columns[col].name;
    big.order = big.order && big.order.col === name
      ? (big.order.dir === 1 ? { col: name, dir: -1 } : null)
      : { col: name, dir: 1 };
    big.offset = 0;
    bigPage();
    return;
  }
  if (sortCol === col) sortDir = -sortDir;
  else { sortCol = col; sortDir = 1; }
  renderTable();
});

/* Expand / collapse become "widen / narrow columns" here */
document.getElementById('btnExpand').title = 'Clear sorting';
document.getElementById('btnExpand').addEventListener('click', function () {
  if (big) { if (big.order) { big.order = null; big.offset = 0; bigPage(); } return; }
  sortCol = null; sortDir = 1;
  renderTable();
});
document.getElementById('btnCollapse').style.display = 'none';
document.getElementById('btnWrap').style.display = 'none';

document.getElementById('btnFormat').addEventListener('click', function () {
  if (big) return;
  var res = parse(app.editor.getValue());
  if (!res.ok) { app.run(); LintApp.toast('Fix the CSV before tidying quotes'); return; }
  var d = res.value.delim;
  var out = res.value.rows.map(function (row) {
    return row.map(function (cell) {
      var needs = cell.indexOf(d) !== -1 || cell.indexOf('"') !== -1 ||
                  cell.indexOf('\n') !== -1 || cell !== cell.trim();
      return needs ? '"' + cell.replace(/"/g, '""') + '"' : cell;
    }).join(d);
  }).join('\n');
  app.editor.setValue(out);
  LintApp.toast('Quotes fixed');
});

document.getElementById('btnToJson').addEventListener('click', function () {
  if (big) { bigToJson(); return; }
  var res = parse(app.editor.getValue());
  if (!res.ok) { app.run(); LintApp.toast('Fix the CSV before converting'); return; }
  var rows = res.value.rows;
  var out;
  if (hasHeader && rows.length > 1) {
    var head = rows[0];
    out = rows.slice(1).map(function (r) {
      var o = {};
      for (var i = 0; i < head.length; i++) {
        var v = r[i] === undefined ? null : r[i];
        o[head[i] || colName(i)] = v !== null && isNumeric(v) ? parseFloat(v) : v;
      }
      return o;
    });
  } else {
    out = rows;
  }
  LintApp.copyAndOffer(JSON.stringify(out, null, 2), 'JSON', 'csv', 'json');
});

/* whether the first row names the columns is a setting of the table, not
   an action — so it sits in the table's own bar, as a checkbox */
var headerToggle = document.createElement('label');
headerToggle.className = 'header-toggle';
headerToggle.title = 'Treat the first row as column names';
headerToggle.innerHTML = '<input type="checkbox" id="chkHeader">Header row';
document.getElementById('matchCount').after(headerToggle);

/* the large file's pager, beside them */
headerToggle.insertAdjacentHTML('afterend',
  '<span class="big-pager" id="bigPager" hidden>' +
    '<button type="button" class="icon-btn" id="btnBigPrev" title="Previous 200 rows" aria-label="Previous rows">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>' +
    '<span id="bigPos"></span>' +
    '<button type="button" class="icon-btn" id="btnBigNext" title="Next 200 rows" aria-label="Next rows">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>' +
  '</span>');
document.getElementById('btnBigPrev').addEventListener('click', function () { bigTurn(-1); });
document.getElementById('btnBigNext').addEventListener('click', function () { bigTurn(1); });
/* the editor's Copy and Download have no text to copy for a large file */
LintApp.when('btnCopy', function () { return !big; });
LintApp.when('btnBigCsv', function () { return !!big; });
document.getElementById('btnBigCsv').addEventListener('click', bigDownload);
LintApp.when('btnDownload', function () { return !big; });
var chkHeader = document.getElementById('chkHeader');
chkHeader.checked = hasHeader;
chkHeader.addEventListener('change', function () {
  hasHeader = chkHeader.checked;
  try { localStorage.setItem('lintuz-csv-header', hasHeader ? '1' : '0'); } catch (e) {}
  sortCol = null;
  if (big) { bigLoadFile(); return; }
  app.editor.paint();
  app.run();
});
})();
</script>
</body>
</html>
